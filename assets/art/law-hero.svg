 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CCB08F"/><stop offset="1" stop-color="#AA9373"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#07131d" flood-opacity=".3"/></filter>
</defs>
<rect width="1200" height="900" rx="56" fill="url(#bg)"/>
<circle cx="980" cy="130" r="210" fill="none" stroke="#486C8E" stroke-width="2" opacity=".55"/>
<circle cx="1050" cy="770" r="300" fill="none" stroke="#486C8E" stroke-width="2" opacity=".3"/>

