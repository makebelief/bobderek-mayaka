<text x="145" y="730" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" font-weight="700">LAW · STRATEGY · RESOLUTION</text>
<text x="145" y="785" fill="#CCB08F" font-family="Arial, sans-serif" font-size="22" letter-spacing="6">BOBDEREK MAYAKA</text>

